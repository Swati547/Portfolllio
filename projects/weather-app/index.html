<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101419" />
    <title>Weather App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div><p class="eyebrow">Atmospheric conditions</p><h1>Weather <em>projects</em></h1></div>
        <div class="live-status"><span></span> Live data</div>
      </header>
      <main class="weather-card">
        <section class="search-section" aria-label="Search for a location">
          <div class="search-box"><span class="search-pin" aria-hidden="true">⌖</span><input id="cityInput" type="text" placeholder="Search city..." aria-label="Search location" autocomplete="off" /><button id="searchBtn" type="button" aria-label="Search weather"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.1-5.4a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" /></svg></button></div>
          <div id="locationResults" class="location-results" aria-live="polite" role="listbox"></div>
        </section>
        <section class="current-weather">
          <div class="weather-symbol" id="weatherIcon" aria-hidden="true"><img id="weatherIconImage" alt="" hidden /><span id="weatherIconFallback">☀</span></div>
          <div class="current-copy"><p class="location" id="cityName">Loading...</p><div class="temperature" id="temperature">--°</div><p class="condition" id="condition">Fetching weather...</p></div>
          <div class="updated"><span>Last updated</span><strong id="currentDate">--</strong></div>
        </section>
        <section class="stats" aria-label="Current conditions">
          <div class="stat-box"><span class="stat-icon">◌</span><div><small>Feels like</small><strong id="feelsLike">--°</strong></div></div>
          <div class="stat-box"><span class="stat-icon">◉</span><div><small>Humidity</small><strong id="humidity">--%</strong></div></div>
          <div class="stat-box"><span class="stat-icon">≋</span><div><small>Wind speed</small><strong id="wind">-- km/h</strong></div></div>
          <div class="stat-box"><span class="stat-icon">◈</span><div><small>Pressure</small><strong id="pressure">-- hPa</strong></div></div>
        </section>
        <section class="forecast"><div class="section-heading"><h2>Next 5 days</h2><span>Daily outlook</span></div><div id="forecastList" class="forecast-list"></div></section>
      </main>
      <footer><span class="footer-dot"></span> Powered by Open-Meteo <span>•</span> Updates automatically</footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
